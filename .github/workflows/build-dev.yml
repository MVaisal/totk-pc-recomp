name: Build TotK Setup Dev

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Ninja & Vulkan SDK
        run: |
          choco install ninja vulkan-sdk -y --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "tools/requirements.txt") { pip install -r tools/requirements.txt }
          if (Test-Path "tools/requirements-installer.txt") { pip install -r tools/requirements-installer.txt }

      - name: Build Shader Translator (totk_xlate)
        run: |
          python tools/build_xlate.py

      - name: Run Release Packaging Script
        run: |
          python tools/make_release.py --out dist --zip TotK-Setup-Dev-windows.zip

      - name: Upload Release Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Setup-Dev-Windows
          path: |
            TotK-Setup-Dev-windows.zip
            dist/
