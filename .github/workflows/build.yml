name: Build TotK Setup Dev

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Build Dependencies
        run: |
          choco install ninja vulkan-sdk -y --no-progress
          C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm --needed make mingw-w64-x86_64-gcc mingw-w64-x86_64-make"
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          echo "C:\msys64\usr\bin" >> $env:GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          uv pip install --system -r tools/requirements.txt
          if (Test-Path "tools/requirements-installer.txt") {
            uv pip install --system -r tools/requirements-installer.txt
          }

      - name: Build Shader Translator (totk_xlate)
        run: |
          python tools/build_xlate.py

      - name: Build hactool
        env:
          MSYSTEM: MINGW64
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: 1
        run: |
          $env:Path = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:Path
          python tools/build_hactool.py
          if (-not (Test-Path "toolchain/hactool/hactool.exe")) {
            Write-Host "Building hactool directly with static linking..."
            New-Item -ItemType Directory -Force -Path "toolchain/hactool"
            if (-not (Test-Path "toolchain/src/hactool/Makefile")) {
              git clone --depth 1 --recurse-submodules https://github.com/SciresM/hactool.git toolchain/src/hactool
            }
            Copy-Item -Force "toolchain/src/hactool/config.mk.template" "toolchain/src/hactool/config.mk"
            C:\msys64\usr\bin\bash -lc "export PATH=/mingw64/bin:/usr/bin:`$PATH; cd /d/a/totk-pc-recomp/totk-pc-recomp/toolchain/src/hactool && make clean && make -j4 CC='/mingw64/bin/gcc -static'"
            Copy-Item -Force "toolchain/src/hactool/hactool.exe" "toolchain/hactool/hactool.exe"
          }
          if (-not (Test-Path "toolchain/hactool/hactool.exe")) {
            Write-Error "hactool.exe was not produced!"
            exit 1
          }
          Write-Host "hactool.exe built successfully!"
          $global:LASTEXITCODE = 0

      - name: Fetch Precomputed Data & Configure Runtime Library Compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "upstream_data"
          New-Item -ItemType Directory -Force -Path "upstream_licenses"
          New-Item -ItemType Directory -Force -Path "build/pgo"
          New-Item -ItemType Directory -Force -Path "generated/v143"
          New-Item -ItemType Directory -Force -Path "generated/v121"

          $reposToTry = @("TotKRecomp/TotKRecomp")
          try {
            $repoInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
            if ($repoInfo.parent) { $reposToTry = @($repoInfo.parent.full_name) + $reposToTry }
            if ($repoInfo.source) { $reposToTry = @($repoInfo.source.full_name) + $reposToTry }
          } catch {}
          $reposToTry = $reposToTry | Select-Object -Unique

          foreach ($r in $reposToTry) {
            try {
              Write-Host "Checking releases in $r..."
              $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$r/releases" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
              $asset = $releases | ForEach-Object { $_.assets } | Where-Object { $_.name -like "*windows*.zip" } | Select-Object -First 1
              if ($asset) {
                Write-Host "Downloading official release asset: $($asset.name)"
                curl.exe -L -s -o "official_release.zip" "$($asset.browser_download_url)"
                break
              }
            } catch {
              Write-Host "Could not fetch from $r : $_"
            }
          }

          @'
          import zipfile, pathlib, json, re

          zfile = pathlib.Path("official_release.zip")
          if zfile.exists():
              with zipfile.ZipFile(zfile) as zf:
                  for member in zf.namelist():
                      if member.endswith("/"):
                          continue
                      if "/data/" in member:
                          fname = pathlib.Path(member).name
                          data_bytes = zf.read(member)
                          (pathlib.Path("upstream_data") / fname).write_bytes(data_bytes)
                          print("Extracted data:", fname)
                          if fname.startswith("pgo-"):
                              (pathlib.Path("build/pgo") / fname).write_bytes(data_bytes)
                          if fname == "shader_list.tsv":
                              (pathlib.Path("generated/v143") / fname).write_bytes(data_bytes)
                              (pathlib.Path("generated/v121") / fname).write_bytes(data_bytes)
                      elif "/licenses/" in member:
                          fname = pathlib.Path(member).name
                          (pathlib.Path("upstream_licenses") / fname).write_bytes(zf.read(member))

          # Analisis tools/build_game.py untuk membuat generated/v143/layout.json yang valid untuk kompilasi libtotkrt.a
          bg_path = pathlib.Path("tools/build_game.py")
          bg_src = bg_path.read_text(encoding="utf-8")

          print("=== Inspecting build_game.py layout usage ===")
          for idx, line in enumerate(bg_src.splitlines(), 1):
              if "layout" in line or "make_runtime_lib" in line or "make-runtime-lib" in line:
                  print(f"{idx}: {line}")

          # Tangkap semua key dari layout[...] atau layout.get(...)
          keys = set(re.findall(r"layout(?:\.get)?\(\s*['\"]([^'\"]+)['\"]", bg_src))
          keys |= set(re.findall(r"layout\[\s*['\"]([^'\"]+)['\"]\s*\]", bg_src))

          dummy_layout = {
              "version": "v143",
              "chunks": [],
              "files": [],
              "units": [],
              "functions": {},
              "globals": {},
              "romfs": {},
              "exefs": {},
              "text_base": 0x80004000,
              "text_size": 0x04000000,
              "rodata_base": 0x84004000,
              "rodata_size": 0x01000000,
              "data_base": 0x85004000,
              "data_size": 0x01000000,
              "bss_base": 0x86004000,
              "bss_size": 0x01000000,
              "image_size": 0x08000000,
          }
          for k in keys:
              if k not in dummy_layout:
                  dummy_layout[k] = [] if k.endswith("s") else 0

          for ver in ("v143", "v121"):
              gdir = pathlib.Path("generated") / ver
              gdir.mkdir(parents=True, exist_ok=True)
              d = dict(dummy_layout, version=ver)
              (gdir / "layout.json").write_text(json.dumps(d, indent=2), encoding="utf-8")

          # Patch make_release.py: jalankan runtime_lib() asli dari dev agar libtotkrt.a dikompilasi baru,
          # dan pastikan hasilnya disalin ke dist/runtime/libtotkrt.a
          mr_path = pathlib.Path("tools/make_release.py")
          mr_src = mr_path.read_text(encoding="utf-8")

          override_code = """
          import pathlib as _p, shutil as _sh

          def lifted_version(*args, **kwargs):
              return 'v143'

          _orig_runtime_lib = runtime_lib
          def runtime_lib(out, llvm, pgo, *args, **kwargs):
              print('Compiling fresh libtotkrt.a from dev runtime/ sources...')
              _orig_runtime_lib(out, llvm, pgo, *args, **kwargs)
              rt_out = _p.Path(out) / 'runtime'
              rt_out.mkdir(parents=True, exist_ok=True)
              # Pastikan libtotkrt.a hasil build masuk ke dist/runtime/
              for built_a in _p.Path('build').rglob('libtotkrt.a'):
                  _sh.copy2(built_a, rt_out / 'libtotkrt.a')
                  print(f'Copied newly compiled {built_a} -> {rt_out / "libtotkrt.a"}')
                  break

          def _patched_shader_history(*args, **kwargs):
              up = _p.Path('upstream_data/shader_list.tsv')
              if up.exists():
                  print('Using precomputed shader_list.tsv from official release')
                  return up.read_text(encoding='utf-8')
              return ''

          shader_list.history = _patched_shader_history

          _orig_collect_licenses = collect_licenses
          def collect_licenses(out, *args, **kwargs):
              lic = _p.Path(out) / 'licenses'
              lic.mkdir(parents=True, exist_ok=True)
              up_lic = _p.Path('upstream_licenses')
              if up_lic.exists():
                  for f in up_lic.iterdir():
                      if f.is_file():
                          _sh.copy2(f, lic / f.name)
              try:
                  _orig_collect_licenses(out, *args, **kwargs)
              except FileNotFoundError as e:
                  print(f'Skipping missing optional license source: {e}')
          """

          if "if __name__" in mr_src:
              idx = mr_src.rfind("if __name__")
              mr_src = mr_src[:idx] + override_code + "\n" + mr_src[idx:]
          else:
              mr_src += "\n" + override_code

          mr_path.write_text(mr_src, encoding="utf-8")
          print("Patched make_release.py successfully.")
          '@ | python -

      - name: Run Release Packaging Script
        run: |
          python tools/make_release.py --out dist --zip TotK-Setup-Dev-windows.zip

      - name: Upload Release Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Setup-Dev-Windows
          path: |
            TotK-Setup-Dev-windows.zip
            dist/
