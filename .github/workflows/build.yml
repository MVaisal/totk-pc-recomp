name: Build TotK Setup Dev

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Build Dependencies
        run: |
          choco install ninja vulkan-sdk make mingw -y --no-progress

      - name: Install Python Dependencies
        run: |
          uv pip install --system -r tools/requirements.txt
          if (Test-Path "tools/requirements-installer.txt") {
            uv pip install --system -r tools/requirements-installer.txt
          }

      - name: Build Shader Translator (totk_xlate)
        run: |
          python tools/build_xlate.py

      - name: Build hactool
        run: |
          if (Test-Path "tools/build_hactool.py") {
            python tools/build_hactool.py
          } else {
            New-Item -ItemType Directory -Force -Path "toolchain/hactool"
            git clone --depth 1 --recurse-submodules https://github.com/SciresM/hactool.git toolchain/hactool-src
            Copy-Item "toolchain/hactool-src/config.mk.template" "toolchain/hactool-src/config.mk"
            make -C toolchain/hactool-src -j4
            Copy-Item "toolchain/hactool-src/hactool.exe" "toolchain/hactool/hactool.exe"
          }

      - name: Run Release Packaging Script
        run: |
          python tools/make_release.py --out dist --zip TotK-Setup-Dev-windows.zip

      - name: Upload Release Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Setup-Dev-Windows
          path: |
            TotK-Setup-Dev-windows.zip
            dist/
