name: Build TotK Setup Dev (1.4.3 & 1.2.1)
run-name: "TotK Setup Dev #${{ github.run_number }} (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Versi game yang akan di-build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "1.4.3"
          - "1.2.1"
      skip_if_no_change:
        description: "Lewati build jika tidak ada commit baru di upstream"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  models: read

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
    steps:
      - name: Checkout fork dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync fork with upstream & check for new commits
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/valentderah/totk-pc-recomp.git
          git fetch upstream dev

          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          LOCAL_BASE=$(git merge-base HEAD upstream/dev)

          echo "Upstream dev : $UPSTREAM_SHA"
          echo "Local base   : $LOCAL_BASE"

          if [ "$UPSTREAM_SHA" = "$LOCAL_BASE" ]; then
            echo "Tidak ada commit baru di upstream."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_if_no_change }}" != "true" ]; then
              echo "Manual trigger paksa terdeteksi: tetap melanjutkan build."
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "Tidak ada update baru: skip build."
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Commit baru ditemukan! Menyinkronkan cabang dev..."
            cp .github/workflows/build.yml /tmp/build.yml.bak

            if ! git merge upstream/dev -X theirs --no-edit; then
              git merge --abort || true
              git merge upstream/dev --allow-unrelated-histories -X theirs --no-edit
            fi

            mkdir -p .github/workflows
            cp /tmp/build.yml.bak .github/workflows/build.yml
            if ! git diff --quiet .github/workflows/build.yml; then
              git add .github/workflows/build.yml
              git commit --amend --no-edit
            fi

            git push origin dev
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: sync-upstream
    if: needs.sync-upstream.outputs.should_build == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          submodules: recursive

      - name: Set Build Version & Date
        id: build_meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $wib = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "SE Asia Standard Time")
          $tsDate = $wib.ToString("yyyyMMdd")

          # Deteksi repo utama (upstream)
          $upstreamRepo = "valentderah/totk-pc-recomp"
          try {
            $repoInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}" -Headers $headers
            if ($repoInfo.parent) { $upstreamRepo = $repoInfo.parent.full_name }
          } catch {}

          # Ambil 7 digit ID commit terakhir dari branch dev repo utama
          $upstreamCommit = ""
          try {
            $commitInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/$upstreamRepo/commits/dev" -Headers $headers
            if ($commitInfo.sha) { $upstreamCommit = $commitInfo.sha.Substring(0, 7) }
          } catch {
            try {
              $commitInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/$upstreamRepo/commits/main" -Headers $headers
              if ($commitInfo.sha) { $upstreamCommit = $commitInfo.sha.Substring(0, 7) }
            } catch {}
          }

          # Ambil tag rilis terakhir dari upstream
          $upstreamTag = ""
          foreach ($r in @($upstreamRepo, "TotKRecomp/TotKRecomp")) {
            try {
              $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$r/releases" -Headers $headers
              $rel = $releases | Where-Object { -not $_.draft } | Select-Object -First 1
              if ($rel) { $upstreamTag = $rel.tag_name; break }
            } catch {}
          }

          # Baca file VERSION lokal dan hitung versi +1
          $verFile = @("VERSION", "version", "VERSION.txt", "version.txt") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $rawVer = if ($verFile) { (Get-Content $verFile -Raw).Trim() } else { "" }

          $vList = @()
          foreach ($s in @($rawVer, $upstreamTag)) {
            if ($s -match "(\d+)\.(\d+)\.(\d+)") {
              $vList += [Version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
            }
          }

          if ($vList.Count -gt 0) {
            $maxV = ($vList | Sort-Object -Descending | Select-Object -First 1)
            $nextBase = "$($maxV.Major).$($maxV.Minor).$($maxV.Build + 1)"
          } else {
            $nextBase = "0.5.1"
          }

          $shaDot  = if ($upstreamCommit) { ".$upstreamCommit" } else { "" }
          $shaDash = if ($upstreamCommit) { "-$upstreamCommit" } else { "" }

          $fullVersion  = "$nextBase-dev+$tsDate$shaDot"
          $artifactName = "TotK-Setup-$nextBase-dev-$tsDate$shaDash-windows"
          $releaseTag   = "v$fullVersion"

          # Timpa file VERSION di workspace agar dibaca installer
          if ($verFile) { Set-Content -Path $verFile -Value $fullVersion -NoNewline }
          else { Set-Content -Path "VERSION" -Value $fullVersion -NoNewline }

          echo "upstream_repo=$upstreamRepo" >> $env:GITHUB_OUTPUT
          echo "upstream_commit=$upstreamCommit" >> $env:GITHUB_OUTPUT
          echo "full_version=$fullVersion" >> $env:GITHUB_OUTPUT
          echo "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          echo "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

          Write-Host "Build Version: $fullVersion | Tag: $releaseTag | File: $artifactName.zip"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Build Version: ``$fullVersion``"
          if ($upstreamCommit) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Upstream Commit (``$upstreamRepo@dev``):** ``$upstreamCommit``"
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Release Asset:** ``$artifactName.zip``"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Build Dependencies
        run: |
          choco install ninja vulkan-sdk -y --no-progress
          C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm --needed make mingw-w64-x86_64-gcc mingw-w64-x86_64-make"
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          echo "C:\msys64\usr\bin" >> $env:GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          uv pip install --system -r tools/requirements.txt
          if (Test-Path "tools/requirements-installer.txt") {
            uv pip install --system -r tools/requirements-installer.txt
          }

      - name: Build Shader Translator (totk_xlate)
        run: |
          python tools/build_xlate.py

      - name: Build hactool
        env:
          MSYSTEM: MINGW64
          MSYS2_PATH_TYPE: inherit
          CHERE_INVOKING: 1
        run: |
          $env:Path = "C:\msys64\mingw64\bin;C:\msys64\usr\bin;" + $env:Path
          python tools/build_hactool.py
          if (-not (Test-Path "toolchain/hactool/hactool.exe")) {
            Write-Host "Building hactool directly with static linking..."
            New-Item -ItemType Directory -Force -Path "toolchain/hactool"
            if (-not (Test-Path "toolchain/src/hactool/Makefile")) {
              git clone --depth 1 --recurse-submodules https://github.com/SciresM/hactool.git toolchain/src/hactool
            }
            Copy-Item -Force "toolchain/src/hactool/config.mk.template" "toolchain/src/hactool/config.mk"
            C:\msys64\usr\bin\bash -lc "export PATH=/mingw64/bin:/usr/bin:`$PATH; cd /d/a/totk-pc-recomp/totk-pc-recomp/toolchain/src/hactool && make clean && make -j4 CC='/mingw64/bin/gcc -static'"
            Copy-Item -Force "toolchain/src/hactool/hactool.exe" "toolchain/hactool/hactool.exe"
          }
          if (-not (Test-Path "toolchain/hactool/hactool.exe")) {
            Write-Error "hactool.exe was not produced!"
            exit 1
          }
          Write-Host "hactool.exe built successfully!"
          $global:LASTEXITCODE = 0

      - name: Fetch exefs & Run Native Lifter (v143 & v121)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VER: ${{ github.event.inputs.target_version || 'all' }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $dlHeaders = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" }
          $myReleases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers
          $allAssets = $myReleases | ForEach-Object { $_.assets }

          $builtAny = $false

          # 1. Cek dan Lift v1.4.3 (mencari exefs.zip atau exefs-143.zip)
          if ($env:TARGET_VER -eq "all" -or $env:TARGET_VER -eq "1.4.3") {
            $asset143 = $allAssets | Where-Object { $_.name -in @("exefs.zip", "exefs-143.zip", "exefs_143.zip") } | Select-Object -First 1
            if ($asset143) {
              Write-Host "Downloading $($asset143.name) for v1.4.3..."
              Invoke-WebRequest -Uri $asset143.url -Headers $dlHeaders -OutFile "exefs_143.zip"
              New-Item -ItemType Directory -Force -Path "build/extracted/v143/exefs"
              Expand-Archive -Path "exefs_143.zip" -DestinationPath "build/extracted/v143/exefs" -Force
              if (Test-Path "build/extracted/v143/exefs/exefs") {
                Move-Item -Path "build/extracted/v143/exefs/exefs/*" -Destination "build/extracted/v143/exefs/" -Force
                Remove-Item -Path "build/extracted/v143/exefs/exefs" -Recurse -Force
              }
              Write-Host "Running native lifter recomp/gen.py for v143..."
              python recomp/gen.py --exefs build/extracted/v143/exefs --out generated/v143
              $builtAny = $true
            }
          }

          # 2. Cek dan Lift v1.2.1 (mencari exefs-121.zip atau exefs_121.zip)
          if ($env:TARGET_VER -eq "all" -or $env:TARGET_VER -eq "1.2.1") {
            $asset121 = $allAssets | Where-Object { $_.name -in @("exefs-121.zip", "exefs_121.zip") } | Select-Object -First 1
            if ($asset121) {
              Write-Host "Downloading $($asset121.name) for v1.2.1..."
              Invoke-WebRequest -Uri $asset121.url -Headers $dlHeaders -OutFile "exefs_121.zip"
              New-Item -ItemType Directory -Force -Path "build/extracted/v121/exefs"
              Expand-Archive -Path "exefs_121.zip" -DestinationPath "build/extracted/v121/exefs" -Force
              if (Test-Path "build/extracted/v121/exefs/exefs") {
                Move-Item -Path "build/extracted/v121/exefs/exefs/*" -Destination "build/extracted/v121/exefs/" -Force
                Remove-Item -Path "build/extracted/v121/exefs/exefs" -Recurse -Force
              }
              Write-Host "Running native lifter recomp/gen.py for v121..."
              python recomp/gen.py --exefs build/extracted/v121/exefs --out generated/v121
              $builtAny = $true
            }
          }

          if (-not $builtAny) {
            Write-Error "Tidak ditemukan aset exefs.zip / exefs-143.zip / exefs-121.zip di Draft Release!"
            exit 1
          }

      - name: Fetch Upstream Precomputed PGO & Configure make_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_VERSION: ${{ steps.build_meta.outputs.full_version }}
          UPSTREAM_REPO: ${{ steps.build_meta.outputs.upstream_repo }}
        run: |
          New-Item -ItemType Directory -Force -Path "upstream_data"
          New-Item -ItemType Directory -Force -Path "upstream_licenses"
          New-Item -ItemType Directory -Force -Path "build/pgo"

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          foreach ($r in @($env:UPSTREAM_REPO, "TotKRecomp/TotKRecomp") | Select-Object -Unique) {
            try {
              $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$r/releases" -Headers $headers
              $rel = $releases | Where-Object { -not $_.draft } | Select-Object -First 1
              if ($rel) {
                $asset = $rel.assets | Where-Object { $_.name -like "*windows*.zip" } | Select-Object -First 1
                if ($asset) {
                  curl.exe -L -s -o "official_release.zip" "$($asset.browser_download_url)"
                  break
                }
              }
            } catch {}
          }

          @'
          import zipfile, pathlib, re, os

          # Patch missing <mutex> header in FidelityFX SDK for Clang libc++
          ffx_compat = pathlib.Path("runtime/third_party/FidelityFX/ffx_compat.h")
          if ffx_compat.exists():
              src = ffx_compat.read_text(encoding="utf-8")
              if "<mutex>" not in src:
                  ffx_compat.write_text(src + "\n#ifdef __cplusplus\n#include <mutex>\n#endif\n", encoding="utf-8")
                  print("Patched <mutex> into ffx_compat.h")

          full_version = os.environ.get("FULL_VERSION", "0.5.1-dev")

          zfile = pathlib.Path("official_release.zip")
          if zfile.exists():
              with zipfile.ZipFile(zfile) as zf:
                  for member in zf.namelist():
                      if member.endswith("/"):
                          continue
                      if "/data/" in member:
                          fname = pathlib.Path(member).name
                          data_bytes = zf.read(member)
                          (pathlib.Path("upstream_data") / fname).write_bytes(data_bytes)
                          # Ekstrak semua file pgo-*.profdata (pgo-v143.profdata, pgo-v121.profdata, dll.)
                          if fname.startswith("pgo-"):
                              (pathlib.Path("build/pgo") / fname).write_bytes(data_bytes)
                              print(f"Extracted PGO profile: {fname}")
                      elif "/licenses/" in member:
                          fname = pathlib.Path(member).name
                          (pathlib.Path("upstream_licenses") / fname).write_bytes(zf.read(member))

          mr_path = pathlib.Path("tools/make_release.py")
          mr_src = mr_path.read_text(encoding="utf-8")

          mr_src = re.sub(
              r"^([ \t]*)(def\s+\w*check\w*\s*\([^)]*\)\s*:)",
              r"\1\2\n\1    print('Skipping headless bundle check on GPU-less CI runner.')\n\1    return",
              mr_src,
              flags=re.MULTILINE
          )

          mr_src = re.sub(
              r'f"\{[^}]*ver[^}]*\}\+\{[^}]+\}"',
              f'"{full_version}"',
              mr_src
          )

          override_code = """
          import pathlib as _p, shutil as _sh

          def _patched_shader_history(*args, **kwargs):
              up = _p.Path('upstream_data/shader_list.tsv')
              if up.exists():
                  return up.read_text(encoding='utf-8')
              return ''

          shader_list.history = _patched_shader_history

          _orig_collect_licenses = collect_licenses
          def collect_licenses(out, *args, **kwargs):
              lic = _p.Path(out) / 'licenses'
              lic.mkdir(parents=True, exist_ok=True)
              up_lic = _p.Path('upstream_licenses')
              if up_lic.exists():
                  for f in up_lic.iterdir():
                      if f.is_file():
                          _sh.copy2(f, lic / f.name)
              try:
                  _orig_collect_licenses(out, *args, **kwargs)
              except FileNotFoundError as e:
                  print(f'Skipping missing optional license source: {e}')
          """

          if "if __name__" in mr_src:
              idx = mr_src.rfind("if __name__")
              mr_src = mr_src[:idx] + override_code + "\n" + mr_src[idx:]
          else:
              mr_src += "\n" + override_code

          mr_path.write_text(mr_src, encoding="utf-8")
          print(f"Configured make_release.py with version: {full_version}")
          '@ | python -

      - name: Run Release Packaging Script
        run: |
          python tools/make_release.py --out TotKRecomp-Dev

      - name: Package Release ZIP
        run: |
          $zipName = "${{ steps.build_meta.outputs.artifact_name }}.zip"
          Compress-Archive -Path "TotKRecomp-Dev/*" -DestinationPath $zipName -Force
          Write-Host "Packaged release archive: $zipName"

      - name: Generate Human-Readable Changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }

          # Cari tag rilis non-draft terakhir sebelumnya di repo ini
          $prevTag = ""
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers
            $lastRel = $releases | Where-Object { -not $_.draft -and $_.tag_name -ne "${{ steps.build_meta.outputs.release_tag }}" } | Select-Object -First 1
            if ($lastRel) { $prevTag = $lastRel.tag_name }
          } catch {}

          if ($prevTag) {
            $rawCommits = (git log "$prevTag..HEAD" --pretty=format:"- %h %s" --no-merges) -join "`n"
          } else {
            $rawCommits = (git log -n 10 --pretty=format:"- %h %s" --no-merges) -join "`n"
          }

          if ([string]::IsNullOrWhiteSpace($rawCommits)) {
            $summary = "- Tidak ada perubahan fitur baru pada build kali ini (hanya pembaruan rutin otomatis)."
            $rawCommits = "- Tidak ada commit baru sejak rilis sebelumnya."
          } else {
            $prompt = "Ubah daftar commit teknis berikut dari port PC game Zelda Tears of the Kingdom menjadi poin-poin catatan rilis (changelog) berbahasa Indonesia yang santai, jelas, dan mudah dipahami pemain awam (hindari istilah kode/programming yang rumit, fokus pada efeknya ke performa, visual, kontrol, atau kestabilan game). Langsung tulis daftar poinnya tanpa kata pengantar:`n`n$rawCommits"

            $payload = @{
              model = "gpt-4o-mini"
              messages = @(
                @{ role = "user"; content = $prompt }
              )
              temperature = 0.3
            } | ConvertTo-Json -Depth 5

            $summary = ""
            try {
              $aiHeaders = @{
                Authorization = "Bearer $env:GH_TOKEN"
                "Content-Type" = "application/json; charset=utf-8"
              }
              $resp = Invoke-RestMethod -Uri "https://models.inference.ai.azure.com/chat/completions" -Method Post -Headers $aiHeaders -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))
              $summary = $resp.choices[0].message.content.Trim()
            } catch {
              Write-Warning "Gagal memanggil GitHub Models API: $_"
            }

            if ([string]::IsNullOrWhiteSpace($summary)) {
              $summary = $rawCommits
            }
          }

          $compareLabel = if ($prevTag) { "sejak ``$prevTag``" } else { "terbaru" }
          $bodyText = @"
          ### Apa yang Baru di Build Ini? ($compareLabel)
          $summary

          <details>
          <summary>Lihat detail commit teknis</summary>

          $rawCommits
          </details>
          "@

          $eof = "CHANGELOG_EOF_$(Get-Random)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$eof"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $bodyText
          Add-Content -Path $env:GITHUB_OUTPUT -Value $eof

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_meta.outputs.release_tag }}
          name: "TotK Recomp Dev (${{ steps.build_meta.outputs.full_version }})"
          body: ${{ steps.changelog.outputs.body }}
          target_commitish: dev
          prerelease: true
          generate_release_notes: false
          files: |
            ${{ steps.build_meta.outputs.artifact_name }}.zip

      - name: Upload Release Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_meta.outputs.artifact_name }}
          path: TotKRecomp-Dev/
          include-hidden-files: true
          retention-days: 7
